active_model = "mistral-large-4"
default_agent = "smart-approve"
enable_telemetry = false
vim_keybindings = true
installed_agents = [
    "lean",
]
theme = "mistral-light"

[[mcp_servers]]
name = "crates-io"
transport = "stdio"
command = "cratesio-mcp"
args = [
    "--transport",
    "stdio",
]

[[mcp_servers]]
name = "bun-mcp"
transport = "stdio"
command = "bunx"
args = [
    "-y",
    "mcp-bun@latest",
]

[mcp_servers.env]
DISABLE_NOTIFICATIONS = "true"

[[mcp_servers]]
url = "https://api.githubcopilot.com/mcp/"
name = "github"
transport = "streamable-http"
disabled = true

[mcp_servers.auth]
api_key_env = "GITHUB_PERSONAL_ACCESS_TOKEN"
type = "static"

[[mcp_servers]]
url = "https://mcp.datadoghq.eu/v1/mcp"
name = "datadog"
transport = "streamable-http"
disabled = true

[mcp_servers.auth]
api_key_env = "DATADOG_MCP_TOKEN"
type = "static"
